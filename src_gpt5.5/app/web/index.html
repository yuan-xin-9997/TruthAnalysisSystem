<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>特朗普真实社交贴文分析系统</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">TS</div>
        <div>
          <strong>贴文分析系统</strong>
          <span>Truth Social Research</span>
        </div>
      </div>
      <nav>
        <button data-route="dashboard" class="active">仪表盘</button>
        <button data-route="crawler">抓取</button>
        <button data-route="posts">贴文</button>
        <button data-route="analysis">文本分析</button>
        <button data-route="market">股市分析</button>
        <button data-route="tasks">任务中心</button>
        <button data-route="settings">系统配置</button>
        <button data-route="permissions" data-admin-only="true">权限管理</button>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">仪表盘</h1>
          <p id="page-subtitle">本地数据、每日抓取、智能分析和美股研究。</p>
        </div>
        <div class="top-actions">
          <button id="refresh-btn">刷新</button>
          <button id="daily-btn" class="primary">运行每日链路</button>
          <span id="user-info" class="user-info" hidden></span>
          <button id="logout-btn" hidden>退出</button>
        </div>
      </header>
      <section id="app" class="content"></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
