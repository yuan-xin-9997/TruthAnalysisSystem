<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 特朗普真实社交贴文分析系统</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card-bg: #ffffff;
        --primary: #2364aa;
        --primary-hover: #1d527e;
        --text: #1f2933;
        --muted: #5f6b76;
        --border: #d8dde2;
        --error-bg: #fdecea;
        --error-text: #b54848;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 40px 36px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 12px 28px rgba(20, 30, 50, 0.08);
        border: 1px solid var(--border);
      }
      .login-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 1px;
      }
      .brand-text strong { display: block; font-size: 16px; }
      .brand-text span { font-size: 12px; color: var(--muted); }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
      label {
        display: block;
        margin-bottom: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      label span { display: block; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
        color: var(--text);
      }
      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(35, 100, 170, 0.15);
      }
      button {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.15s;
      }
      button:hover { background: var(--primary-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .error {
        background: var(--error-bg);
        color: var(--error-text);
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .error.visible { display: block; }
      .footer-note {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <form class="login-card" id="login-form">
      <div class="login-brand">
        <div class="brand-mark">TS</div>
        <div class="brand-text">
          <strong>贴文分析系统</strong>
          <span>Truth Social Research</span>
        </div>
      </div>
      <h1>登录</h1>
      <p class="subtitle">使用 data/password.txt 中配置的用户名和密码。</p>
      <div class="error" id="login-error"></div>
      <label>
        <span>用户名</span>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </label>
      <label>
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button id="submit" type="submit">登录</button>
      <p class="footer-note">仅限授权用户访问，操作行为将记录在系统中。</p>
    </form>
    <script>
      const form = document.querySelector("#login-form");
      const errorEl = document.querySelector("#login-error");
      const submitBtn = document.querySelector("#submit");

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("visible");
      }

      function hideError() {
        errorEl.classList.remove("visible");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError();
        const username = document.querySelector("#username").value.trim();
        const password = document.querySelector("#password").value;
        if (!username || !password) {
          showError("请输入用户名和密码");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "登录中...";
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            showError(data.error || "登录失败");
            return;
          }
          window.location.href = "/";
        } catch (err) {
          showError(err.message || "网络错误");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "登录";
        }
      });

      // If already logged in, skip the login page.
      fetch("/api/auth/me", { credentials: "same-origin" })
        .then((r) => (r.ok ? (window.location.href = "/") : null))
        .catch(() => {});
    </script>
  </body>
</html>
